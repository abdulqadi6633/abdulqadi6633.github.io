<!--
  ============================================================
  RETRO OS VARIANT B — "CMOS SETUP" : BIOS setup utility,
  deep blue screen, amber highlights, F-key hints.
  EDIT ME: the LINKS array in the <script> at the bottom.
  ============================================================
-->

<style>
  :root{
    --blue:#00007a;
    --panel:#0000a8;
    --fg:#c0c0c0;
    --amber:#ffb000;
    --red:#ff4040;
  }
  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; min-height:100%;
    background:var(--blue);
    color:var(--fg);
    font-family:'VT323',monospace;
    overflow-x:hidden;
  }

  /* scanlines */
  body::after{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0 2px, transparent 2px 4px),
      radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.5) 100%);
    z-index:9;
  }

  .screen{
    max-width:470px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:18px 12px 14px;
  }

  .bios-header{
    text-align:center;
    border:2px solid var(--fg);
    padding:8px 6px;
    margin-bottom:10px;
    background:var(--panel);
  }
  .bios-header .rom{
    font-size:20px;
    letter-spacing:2px;
  }
  .bios-header .name{
    font-family:'Permanent Marker',cursive;
    font-size:clamp(30px,8.5vw,46px);
    color:var(--amber);
    text-shadow:2px 2px 0 #000;
    transform:rotate(-1.5deg);
    filter:url(#roughen);
    margin:6px 0 4px;
    line-height:1.1;
  }
  .bios-header .ver{
    font-size:17px;
    opacity:.8;
  }

  .panel{
    border:2px solid var(--fg);
    background:var(--panel);
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .panel-title{
    text-align:center;
    font-size:20px;
    letter-spacing:3px;
    border-bottom:2px solid var(--fg);
    padding:6px;
    color:var(--amber);
  }

  .links{
    list-style:none;
    margin:0; padding:10px 8px;
  }
  .links a{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:8px 10px;
    font-size:22px;
    color:var(--fg);
    text-decoration:none;
    letter-spacing:1px;
  }
  .links a .val{
    color:var(--amber);
    font-size:19px;
  }
  .links a:hover{
    background:var(--red);
    color:#fff;
  }
  .links a:hover .val{ color:#fff; }
  .links a .dots{
    flex:1;
    margin:0 10px;
    border-bottom:2px dotted rgba(192,192,192,0.4);
    transform:translateY(-4px);
  }

  a.nowline{
    display:block;
    margin:4px 10px 10px;
    padding:8px 10px;
    border:2px solid var(--amber);
    color:var(--amber);
    font-size:19px;
    letter-spacing:1px;
    text-align:center;
    text-decoration:none;
    animation:blink 1.6s steps(1) infinite;
  }
  a.nowline:hover{
    animation:none;
    background:var(--amber);
    color:var(--blue);
  }
  @keyframes blink{ 50%{ opacity:.35; } }

  .keybar{
    display:flex;
    flex-wrap:wrap;
    gap:4px 14px;
    border-top:2px solid var(--fg);
    padding:8px 10px;
    font-size:17px;
    background:var(--blue);
  }
  .keybar b{
    color:var(--amber);
    font-weight:normal;
  }

  .postline{
    margin-top:10px;
    font-size:18px;
    letter-spacing:1px;
    opacity:.85;
  }
  .cursor{
    display:inline-block;
    width:10px; height:16px;
    background:var(--fg);
    vertical-align:text-bottom;
    animation:blink 1s steps(1) infinite;
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="9" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="screen">
  <div class="bios-header">
    <div class="rom">DEADBEAT ROM BIOS (C) 199X</div>
    <!-- EDIT ME: your name -->
    <h1 class="name">deadbeat0nline</h1>
    <div class="ver">REV 6.66 &mdash; ALL RIGHTS ABANDONED</div>
  </div>

  <div class="panel">
    <div class="panel-title">LINK CONFIGURATION SETUP</div>
    <ul class="links" id="links"></ul>
    <a class="nowline" id="nowplaying" href="#" target="_blank" rel="noopener noreferrer">&#9654; NOW PLAYING: ...</a>
    <div class="keybar">
      <span><b>&uarr;&darr;</b>:Select</span>
      <span><b>ENTER</b>:Open</span>
      <span><b>F10</b>:Save &amp; Exit</span>
      <span><b>ESC</b>:No Escape</span>
    </div>
  </div>

</div>

<script>
  // ============================================================
  // Content comes from config.json (edit it with admin.html).
  // The FALLBACK below is only used if config.json can't load
  // (e.g. opening this file directly from disk).
  // ============================================================
  const FALLBACK = {
    nowPlaying: { title: "Your Newest Song", url: "https://open.spotify.com/artist/yourid" },
    links: [
      { label: "Instagram",   url: "https://instagram.com/yourhandle" },
      { label: "X / Twitter", url: "https://x.com/yourhandle" },
      { label: "TikTok",      url: "https://tiktok.com/@yourhandle" },
      { label: "Spotify",     url: "https://open.spotify.com/artist/yourid", extra: "[Loud]" },
      { label: "Bandcamp",    url: "https://yourname.bandcamp.com", extra: "[Louder]" },
      { label: "SoundCloud",  url: "https://soundcloud.com/yourhandle" }
    ]
  };

  function render(cfg){
    const ul = document.getElementById('links');
    ul.innerHTML = '';
    cfg.links.forEach(l => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.innerHTML = `<span>${l.label}</span><span class="dots"></span><span class="val">${l.extra || '[Enabled]'}</span>`;
      li.appendChild(a);
      ul.appendChild(li);
    });
    const np = document.getElementById('nowplaying');
    if(cfg.nowPlaying && cfg.nowPlaying.title){
      np.href = cfg.nowPlaying.url || '#';
      np.innerHTML = `&#9654; NOW PLAYING: ${cfg.nowPlaying.title}`;
    } else {
      np.style.display = 'none';
    }
  }

  fetch('config.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(render)
    .catch(() => render(FALLBACK));
</script>

</body>
</html>
